<!doctype html>

		<title>Looksy Bitrix v1 test</title>

				padding: 32px;

			}

			.page {
				max-width: 520px;
				margin: 0 auto;
				background: #fff;

			.product-image {
				display: block;
				width: 100%;
				aspect-ratio: 3 / 4;
				object-fit: cover;
				background: #eee;
			}

			.product-name {
				margin: 18px 0 8px;
				font-size: 24px;
				font-weight: 600;
			}

			.product-price {
				font-size: 20px;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<main class="page">
			<div
				class="ns-bitrix c-catalog-element c-catalog-element-catalog-default-5"
				data-fitting-product
				data-fitting-name="Боди кружево"
				data-fitting-price="3 990 ₽"

				<div class="product-price">3 990 ₽</div>

			</div>
		</main>

		<script
			src="https://intyadmin.netlify.app/looksy/bitrix_v1_script.js"
			data-shop-token="e0e7fd17-9d27-459f-8edb-094eb5817df7"
			data-adapter="bitrix_v1"

</html>
